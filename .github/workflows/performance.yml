name: Handwritten tree performance comparison
'on':
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'src/eeg_ma/performance.py'
      - 'src/eeg_ma/random_forest.py'
      - 'src/eeg_ma/lightgbm_histogram.py'
      - 'scripts/03_intra_subject.py'
      - 'scripts/04_inter_subject.py'
      - 'tests/test_performance.py'
      - '.github/workflows/performance.yml'
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Existing commit SHA for same-host before/after benchmark'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: perf-compare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg
  EEG_MA_INSTALL_REPORT: ${{ github.workspace }}/outputs/bench/install.json
  EEG_MA_REFERENCE_SPEC: ${{ github.workspace }}/environment/reference.json
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline_sha }}
jobs:
  same-host:
    name: Same-host baseline and candidate (three measured repeats)
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: environment/reference-linux-x86_64-py312.lock
      - name: Install reference environment
        run: |
          mkdir -p outputs/bench
          python -m venv .venv-reference
          .venv-reference/bin/python -m pip install --force-reinstall --no-deps --require-hashes --only-binary=:all: --report outputs/bench/install.json -r environment/reference-linux-x86_64-py312.lock
          .venv-reference/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv-reference/bin/python -m pip check
      - name: Verify reference and immutable baseline checkout
        run: |
          .venv-reference/bin/python scripts/18_environment.py verify --out outputs/bench/environment.json
          git cat-file -e "$BASE_SHA^{commit}"
          git worktree add --detach outputs/bench/base "$BASE_SHA"
          test -f outputs/bench/base/src/eeg_ma/random_forest.py
          test -f outputs/bench/base/src/eeg_ma/lightgbm.py
      - name: Benchmark on same runner with identical inputs
        timeout-minutes: 22
        run: |
          PYTHONPATH="$PWD/outputs/bench/base/src" .venv-reference/bin/python benchmarks/run.py suite --out-dir outputs/bench/before --inputs-dir outputs/bench/inputs --preset ci --jobs 1 2 --repeats 3 --warmups 1 --profile
          PYTHONPATH="$PWD/src" .venv-reference/bin/python benchmarks/run.py suite --out-dir outputs/bench/after --inputs-dir outputs/bench/inputs --preset ci --jobs 1 2 --repeats 3 --warmups 1 --profile
          .venv-reference/bin/python benchmarks/run.py compare --baseline outputs/bench/before --candidate outputs/bench/after --output outputs/bench/comparison.json
      - name: Save performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/bench/
          if-no-files-found: warn
          retention-days: 90

  large-workloads:
    # This synthetic large-case canary is opt-in; ordinary PRs only run the
    # bounded two-fixture same-host comparison. The complete 16-case matrix
    # likewise stays in performance-full.yml (workflow_dispatch).
    if: github.event_name == 'workflow_dispatch'
    name: Candidate 3000/6000-row jobs=1,2,4 (3 measured repeats)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: environment/reference-linux-x86_64-py312.lock
      - name: Install exact reference wheels
        run: |
          mkdir -p outputs/large
          python -m venv .venv-reference
          .venv-reference/bin/python -m pip install --force-reinstall --no-deps --require-hashes --only-binary=:all: --report outputs/large/install.json -r environment/reference-linux-x86_64-py312.lock
          .venv-reference/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv-reference/bin/python -m pip check
      - name: Pin actual runtime identity
        run: |
          EEG_MA_INSTALL_REPORT="$PWD/outputs/large/install.json" .venv-reference/bin/python scripts/18_environment.py verify --out outputs/large/environment.json
      - name: Measure bounded 3000- and 6000-row synthetic workload
        timeout-minutes: 60
        run: |
          .venv-reference/bin/python benchmarks/run.py suite --preset full \
            --case-only r3000-f168-correlated r6000-f312-sparse \
            --jobs 1 2 4 --repeats 3 --warmups 1 --timeout 300 --profile \
            --out-dir outputs/large/measurement
      - name: Retain synthetic large-workload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-large-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/large/
          if-no-files-found: warn
          retention-days: 90
