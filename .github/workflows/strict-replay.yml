name: Manual strict training replay

'on':
  workflow_dispatch:
    inputs:
      max_model_fits:
        description: 'Maximum total complete RF/LightGBM inner+outer fits per S/F run'
        required: true
        default: '64'
        type: string
      max_projected_nodes:
        description: 'Maximum conservative tree-node work per run'
        required: true
        default: '100000'
        type: string
      max_seconds:
        description: 'Maximum soft training replay time per run (seconds)'
        required: true
        default: '600'
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: strict-manual-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg
  EEG_MA_INSTALL_REPORT: ${{ github.workspace }}/outputs/strict/install.json
  EEG_MA_REFERENCE_SPEC: ${{ github.workspace }}/environment/reference.json
  MAX_MODEL_FITS: ${{ inputs.max_model_fits }}
  MAX_PROJECTED_NODES: ${{ inputs.max_projected_nodes }}
  MAX_SECONDS: ${{ inputs.max_seconds }}

jobs:
  strict-replay:
    name: CPython 3.12.14 / synthetic S+F complete replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: environment/reference-linux-x86_64-py312.lock
      - name: Validate explicit resource limits
        run: |
          python - <<'PY'
          import os
          a, b, c = (os.environ[k] for k in ('MAX_MODEL_FITS', 'MAX_PROJECTED_NODES', 'MAX_SECONDS'))
          assert a.isdecimal() and 1 <= int(a) <= 10000, 'max_model_fits must be [1,10000]'
          assert b.isdecimal() and 1 <= int(b) <= 10000000, 'max_projected_nodes must be [1,10000000]'
          assert c.isdecimal() and 1 <= int(c) <= 1800, 'max_seconds must be [1,1800]'
          PY
      - name: Rebuild isolated locked reference environment
        run: |
          mkdir -p outputs/strict
          python -m venv .venv-reference
          .venv-reference/bin/python -m pip install --force-reinstall --no-deps --require-hashes --only-binary=:all: --report outputs/strict/install.json -r environment/reference-linux-x86_64-py312.lock
          .venv-reference/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv-reference/bin/python -m pip check
      - name: Verify runtime and original numerical contracts
        run: |
          .venv-reference/bin/python scripts/18_environment.py verify --out outputs/strict/environment.json
          .venv-reference/bin/python -m pytest tests/test_strict_oracles.py --junitxml=outputs/strict/pytest.xml
      - name: Generate independent synthetic inputs and complete S/F group-CV runs
        timeout-minutes: 15
        run: .venv-reference/bin/python tests/run_five_classifier_exploratory_smoke.py --out-dir outputs/strict/source
      - name: Refit and compare all RF and LightGBM inner candidates
        timeout-minutes: 20
        run: |
          for track in S F; do
            .venv-reference/bin/python scripts/26_strict_verify.py verify \
              --run "outputs/strict/source/comparison/$track" \
              --out-dir "outputs/strict/verified-$track" \
              --max-outer-folds 6 --max-candidates 4 \
              --max-model-fits "$MAX_MODEL_FITS" \
              --max-projected-nodes "$MAX_PROJECTED_NODES" \
              --max-seconds "$MAX_SECONDS" \
              > "outputs/strict/replay-$track.json"
          done
          .venv-reference/bin/python scripts/26_strict_verify.py oracles --out-dir outputs/strict/independent-oracles > outputs/strict/oracle-cli.json
      - name: Preserve exact environment, input, model and replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strict-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/strict/
          if-no-files-found: error
          retention-days: 90
